apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelmcp
  namespace: default
  labels:
    app: sentinelmcp
    tier: sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelmcp
  template:
    metadata:
      labels:
        app: sentinelmcp
        tier: sre-agent
    spec:
      serviceAccountName: sentinelmcp-sa
      containers:
        - name: sentinelmcp
          image: sentinelmcp:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.main", "serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sentinelmcp-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelmcp-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinelmcp-secrets
                  key: GROQ_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelmcp
  namespace: default
  labels:
    app: sentinelmcp
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: sentinelmcp
