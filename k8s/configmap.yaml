apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelmcp-config
  namespace: default
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  LLM_PROVIDER: "groq"
  LLM_MODEL: "qwen/qwen3.8-27b"
  K8S_IN_CLUSTER: "true"
  K8S_NAMESPACE: "default"
  TELEMETRY_API_URL: "http://jaeger.jaeger.svc.cluster.local:16686"
  SENTINEL_DRY_RUN: "false"
  MAX_RESTARTS_PER_HOUR: "3"
  MAX_REPLICAS_LIMIT: "10"
  MIN_REPLICAS_LIMIT: "1"
  REMEDIATION_COOLDOWN_SECONDS: "120"
